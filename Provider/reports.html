<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports — ReviFlow</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/logo-180.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_datepicker.css">
<script src="../_config.js"></script>
<script src="../_guard.js"></script>
<script src="../_store.js"></script>
<script src="../_session.js"></script>
<script src="../_codes.js"></script>
<script src="../_datepicker.js"></script>
<style>
:root{
  --paper:#FAF8F3;--paper-2:#F2EFE7;--ink:#0D1A16;--muted:#5D6B67;--dim:#93A19D;
  --line:rgba(13,26,22,.08);--line-2:rgba(13,26,22,.14);
  --green:#0E9D73;--green-d:#0A5C46;--green-s:#E2F4EC;
  --indigo:#5A6CFF;--indigo-s:#EBEDFF;
  --amber:#C98A18;--amber-s:#FAF0DA;
  --coral:#D0603F;--coral-s:#FBEAE4;
  --teal:#1F93AE;--teal-s:#E3F2F6;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --e:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;
  border:1px solid var(--line-2);background:#fff;font-size:12.8px;font-weight:600;cursor:pointer}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.hdr h1{font-family:'Sora',sans-serif;font-size:17px;font-weight:600;letter-spacing:-.038em}
.hdr .sp{flex:1}

.wrap{max-width:1240px;margin:0 auto;padding:22px clamp(18px,3.6vw,40px) 60px}

/* ── choosing a report ── */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:11px;margin-bottom:22px}
.pick{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border-radius:14px;
  border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;
  transition:all .24s var(--e)}
.pick:hover{border-color:var(--line-2);transform:translateY(-1px);
  box-shadow:0 12px 26px -18px rgba(13,26,22,.4)}
.pick.on{border-color:var(--green);background:var(--green-s);
  box-shadow:0 12px 26px -18px rgba(10,92,70,.5)}
.pick .ic{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:var(--paper-2)}
.pick.on .ic{background:#fff}
.pick .ic svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.85;
  stroke-linecap:round;stroke-linejoin:round}
.pick.on .ic svg{stroke:var(--green-d)}
.pick .t{min-width:0}
.pick .t b{display:block;font-size:13.2px;font-weight:600;letter-spacing:-.014em;line-height:1.25}
.pick .t small{display:block;font-size:11.2px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ── the controls ── */
.bar{display:flex;align-items:flex-end;gap:11px;flex-wrap:wrap;padding:15px 17px;
  border:1px solid var(--line);border-radius:15px;background:#fff;margin-bottom:15px}
.fg{display:flex;flex-direction:column}
.fg label{font-size:10.6px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fg input,.fg select{padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--paper-2);font-size:12.8px;min-width:132px}
.fg input:focus,.fg select:focus{outline:none;background:#fff;border-color:var(--green);
  box-shadow:0 0 0 3px rgba(14,157,115,.13)}
.presets{display:flex;gap:2px;padding:3px;border-radius:11px;background:var(--paper-2);
  border:1px solid var(--line)}
.presets button{padding:7px 12px;border:none;background:none;border-radius:8px;
  font-size:11.6px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:all .22s var(--e)}
.presets button:hover{background:rgba(255,255,255,.8);color:var(--ink)}
.presets button.on{background:#fff;color:var(--green-d);box-shadow:0 5px 13px -8px rgba(13,26,22,.5)}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:11px;
  border:1px solid var(--line-2);background:#fff;font-size:12.8px;font-weight:600;cursor:pointer;
  transition:all .22s var(--e)}
.btn:hover{border-color:var(--green);color:var(--green-d)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ── the report ── */
.rep{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.rhead{display:flex;align-items:baseline;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.rhead h2{font-family:'Sora',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.034em}
.rhead p{width:100%;font-size:12.2px;color:var(--muted);line-height:1.5}
.rhead .n{margin-left:auto;font-family:var(--mono);font-size:10.4px;color:var(--dim)}

/* summary figures above a report */
.kpis{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpis > div{flex:1;padding:14px 18px;background:var(--paper);min-width:0}
.kpis dt{font-family:var(--mono);font-size:8.4px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin-bottom:4px}
.kpis dd{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.kpis .due dd{color:var(--coral)}
.kpis .good dd{color:var(--green-d)}
@media (max-width:760px){.kpis{flex-wrap:wrap}.kpis > div{flex:1 1 44%}}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.6px}
th{text-align:left;padding:10px 14px;background:var(--paper-2);
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:8.6px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(13,26,22,.02)}
th.r,td.r{text-align:right}
td.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
td b{font-weight:600}
td small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
tfoot td{background:var(--paper-2);font-weight:600;border-top:2px solid var(--line-2);
  border-bottom:none}

.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-family:var(--mono);
  font-size:8.4px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--green-s);color:var(--green-d)}
.pill.warn{background:var(--amber-s);color:var(--amber)}
.pill.bad{background:var(--coral-s);color:var(--coral)}
.pill.info{background:var(--indigo-s);color:var(--indigo)}
.pill.grey{background:var(--paper-2);color:var(--muted)}
.age{font-family:var(--mono);font-size:11px}
.age.a60{color:var(--amber)}
.age.a90{color:var(--coral);font-weight:600}

.empty{padding:52px 24px;text-align:center;color:var(--muted);line-height:1.6;font-size:13px}
.empty svg{width:38px;height:38px;stroke:var(--line-2);fill:none;stroke-width:1.5;margin-bottom:12px}
.empty b{display:block;font-family:'Sora',sans-serif;font-size:15px;color:var(--ink);margin-bottom:5px}

.spin{display:grid;place-items:center;padding:60px}
.spin i{width:26px;height:26px;border:2.5px solid var(--line-2);border-top-color:var(--green);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  .hdr,.picks,.bar,.btn{display:none!important}
  .wrap{padding:0;max-width:none}
  .rep{border:none;border-radius:0}
  body{background:#fff}
  tbody tr:hover{background:none}
}

/* ══ page header ══
   One definition, identical on every provider page. Several pages were missing
   .hin, .hact or .rf-who and fell back to whatever else happened to apply,
   which is why the buttons sat differently from screen to screen. */
.hdr{position:sticky;top:0;z-index:60;border-bottom:1px solid var(--line,rgba(13,26,22,.08));
  background:rgba(250,248,243,.86);backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%)}
.hin{max-width:1600px;margin:0 auto;padding:11px clamp(14px,2.4vw,30px);
  display:flex;align-items:center;gap:11px;min-height:58px}
.hdr .brand{display:flex;align-items:center;gap:10px;flex:none}
.hdr .brand .mk{width:28px;height:28px;border-radius:9px;display:block}
.hdr .brand span{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;
  letter-spacing:-.036em;white-space:nowrap;line-height:1}
.hdr .brand em{font-style:normal;color:var(--green-d,#0A5C46)}
.crumb{margin-left:12px;padding-left:12px;border-left:1px solid var(--line-2,rgba(13,26,22,.14));
  font-size:12.4px;color:var(--muted,#5D6B67);white-space:nowrap;line-height:1;
  overflow:hidden;text-overflow:ellipsis}
.crumb b{font-weight:600;color:var(--ink,#0D1A16)}
.hact{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
/* _session.js fills this with an avatar and two lines, so it is styled for
   that rather than as a single run of text. */
.rf-who{display:flex;align-items:center;gap:9px;white-space:nowrap;flex:none}
.rf-who:empty{display:none}
.rf-who .rf-av{width:28px;height:28px;flex:none;border-radius:9px;display:grid;
  place-items:center;background:linear-gradient(140deg,#0E9D73,#5A6CFF);color:#fff;
  font-family:var(--mono,ui-monospace);font-size:10px;font-weight:700;line-height:1}
.rf-who .rf-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.rf-who .rf-id b{font-size:12.4px;font-weight:600;letter-spacing:-.014em;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rf-who .rf-id small{font-family:var(--mono,ui-monospace);font-size:8.6px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dim,#93A19D);line-height:1}
.hbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;
  border:1px solid var(--line-2,rgba(13,26,22,.14));background:rgba(255,255,255,.72);
  font-family:'Manrope',system-ui,sans-serif;font-size:12.6px;font-weight:600;
  color:var(--ink,#0D1A16);cursor:pointer;white-space:nowrap;line-height:1;
  transition:all .24s cubic-bezier(.22,1,.36,1)}
.hbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none;
  transition:transform .24s cubic-bezier(.22,1,.36,1)}
.hbtn:hover{background:#fff;border-color:var(--green,#0E9D73);color:var(--green-d,#0A5C46)}
.hbtn.back:hover{transform:translateX(-2px)}
.hbtn.back:hover svg{transform:translateX(-3px)}
.hbtn.out:hover{border-color:var(--coral,#D0603F);background:var(--coral-s,#FBEAE4);color:#9B3F24}
.hbtn.out:hover svg{transform:translateX(3px)}
@media (max-width:820px){
  .crumb{margin-left:8px;padding-left:8px;max-width:34vw}
  .rf-who{display:none}
  .hbtn{padding:8px 11px}
}
@media (max-width:560px){
  .hdr .brand span{display:none}
  .crumb{margin-left:0;padding-left:0;border-left:none;max-width:none;flex:1}
  .hbtn span,.hbtn.out{font-size:0}
  .hbtn.out svg{width:16px;height:16px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hin">
    <div class="brand">
      <img class="mk" src="../assets/logo-64.png" alt="ReviFlow RCM">
      <span>ReviFlow<em>RCM</em></span>
    </div>
    <span class="crumb">Provider workspace / <b>Reports</b></span>
    <div class="hact">
      <span class="rf-who" id="rfWho"></span>
      <a href="provider-dashboard.html" class="hbtn back"><svg viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>Back</a>
      <a href="../reviflow.html" class="hbtn out">Log out<svg viewBox="0 0 24 24"><path d="M15 12H4M11 6l6 6-6 6"/><path d="M14 4h5a1 1 0 011 1v14a1 1 0 01-1 1h-5"/></svg></a>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="picks" id="picks"></div>

  <div class="bar">
    <span class="presets" id="presets">
      <button data-r="7">7 days</button>
      <button data-r="30" class="on">30 days</button>
      <button data-r="90">90 days</button>
      <button data-r="ytd">Year to date</button>
      <button data-r="all">All time</button>
    </span>
    <label class="fg"><label>From</label>
      <input type="date" id="from" min="1900-01-01" max="2100-12-31"></label>
    <label class="fg"><label>To</label>
      <input type="date" id="to" min="1900-01-01" max="2100-12-31"></label>
    <label class="fg"><label>Provider</label>
      <select id="prov"><option value="">Everyone</option></select></label>
    <span class="sp"></span>
    <button class="btn" id="csv">
      <svg viewBox="0 0 24 24"><path d="M12 3v13M7 12l5 5 5-5M4 20h16"/></svg>Export CSV</button>
    <button class="btn" id="print">
      <svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 19H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2"/><path d="M7 15h10v6H7z"/></svg>Print</button>
  </div>

  <div class="rep" id="rep">
    <div class="spin"><i></i></div>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var SESS=null, PATS=[], APPTS=[], ENCS=[], CLAIMS=[], PAYS=[], PROVS=[], HIST=[];
  var CUR='clients', FROM='', TO='', PROV='';
  var LAST={cols:[],rows:[],title:''};   /* whatever is on screen, for the export */

  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){return '$'+(Math.round((+n||0)*100)/100)
    .toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
  function num(v){return Math.round((parseFloat(v)||0)*100)/100;}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+
    '-'+String(d.getDate()).padStart(2,'0');}
  function D2(v){ if(!v)return null; var p=String(v).slice(0,10).split('-');
    return new Date(+p[0],(+p[1]||1)-1,+p[2]||1,12); }
  function fmtD(v){var d=D2(v);return d?d.toLocaleDateString(undefined,
    {day:'2-digit',month:'short',year:'numeric'}):'—';}
  function fmtTime(m){ if(m==null)return '';
    var d=new Date(); d.setHours(Math.floor(m/60),m%60,0,0);
    return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
  function days(from,to){
    var a=D2(from), b=to?D2(to):new Date();
    return a&&b ? Math.round((b-a)/86400000) : 0;
  }
  function ageCls(n){ return n>=90?'a90':n>=60?'a60':''; }
  function provName(id){
    var p=PROVS.filter(function(x){return String(x.id)===String(id);})[0];
    return p?p.full_name:'';
  }
  function patName(ref){
    var p=PATS.filter(function(x){return String(x.id)===String(ref);})[0];
    return p?[p.last_name,p.first_name].filter(Boolean).join(', '):'Unknown patient';
  }
  function patOf(ref){
    return PATS.filter(function(x){return String(x.id)===String(ref);})[0]||null;
  }
  function inRange(d){
    if(!d) return false;
    var v=String(d).slice(0,10);
    if(FROM && v<FROM) return false;
    if(TO && v>TO) return false;
    return true;
  }
  function mineProv(id){
    if(!PROV) return true;
    return String(id)===String(PROV);
  }

  /* ── the eight reports ── */
  var REPORTS=[
    { id:'clients', name:'Client details',
      blurb:'Everyone on the books, with cover and contact',
      icon:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
      dated:false },
    { id:'appts', name:'Appointment summary',
      blurb:'Visits booked, by provider and outcome',
      icon:'<rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>' },
    { id:'attend', name:'Attendance',
      blurb:'Who came, who did not, and how often',
      icon:'<path d="M5 13l4 4L19 7"/><circle cx="12" cy="12" r="9"/>' },
    { id:'outclaims', name:'Outstanding claims',
      blurb:'Money sitting with the payers, by age',
      icon:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 13h6M9 17h4"/>' },
    { id:'outpat', name:'Outstanding patient balances',
      blurb:'What patients owe, oldest first',
      icon:'<rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19"/>' },
    { id:'filed', name:'Filed claims',
      blurb:'Everything submitted, and what came back',
      icon:'<path d="M5 12h13M13 6l6 6-6 6"/>' },
    { id:'pays', name:'Payment summary',
      blurb:'What came in, from whom, and how',
      icon:'<path d="M12 3v18M17 7H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>' },
    { id:'elig', name:'Eligibility summary',
      blurb:'Cover checks run, and what they found',
      icon:'<path d="M12 3a9 9 0 109 9"/><path d="M12 7v5l3 2"/>' }
  ];

  function paintPicks(){
    $('picks').innerHTML=REPORTS.map(function(r){
      return '<button class="pick'+(r.id===CUR?' on':'')+'" data-rep="'+r.id+'">'+
        '<span class="ic"><svg viewBox="0 0 24 24">'+r.icon+'</svg></span>'+
        '<span class="t"><b>'+esc(r.name)+'</b><small>'+esc(r.blurb)+'</small></span>'+
      '</button>';
    }).join('');
  }

  $('picks').addEventListener('click',function(e){
    var b=e.target.closest('[data-rep]');
    if(!b)return;
    CUR=b.dataset.rep;
    paintPicks(); run();
  });

  /* ── the date range ── */
  $('presets').addEventListener('click',function(e){
    var b=e.target.closest('[data-r]');
    if(!b)return;
    this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
    var r=b.dataset.r, now=new Date();
    if(r==='all'){ FROM=''; TO=''; }
    else if(r==='ytd'){ FROM=iso(new Date(now.getFullYear(),0,1)); TO=iso(now); }
    else { FROM=iso(new Date(now.getTime()-(+r)*86400000)); TO=iso(now); }
    $('from').value=FROM; $('to').value=TO;
    run();
  });

  ['from','to'].forEach(function(id){
    $(id).addEventListener('change',function(){
      FROM=$('from').value; TO=$('to').value;
      $('presets').querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
      run();
    });
  });

  $('prov').addEventListener('change',function(){ PROV=this.value; run(); });

  /* ── shared shape ──
     Every report returns the same thing, so the table, the export and the
     print view are written once rather than eight times. */
  function table(spec){
    LAST = { title:spec.title, cols:spec.cols, rows:spec.rows, foot:spec.foot||null };

    var html='<div class="rhead"><h2>'+esc(spec.title)+'</h2>'+
      '<span class="n">'+spec.rows.length+' ROW'+(spec.rows.length===1?'':'S')+'</span>'+
      '<p>'+esc(spec.note||'')+'</p></div>';

    if(spec.kpis && spec.kpis.length)
      html+='<div class="kpis">'+spec.kpis.map(function(k){
        return '<div'+(k.cls?' class="'+k.cls+'"':'')+'><dt>'+esc(k.label)+'</dt>'+
          '<dd>'+esc(k.value)+'</dd></div>'; }).join('')+'</div>';

    if(!spec.rows.length){
      html+='<div class="empty"><svg viewBox="0 0 24 24" stroke-linecap="round">'+
        '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>'+
        '<b>Nothing to report</b>'+esc(spec.emptyNote||
        'No records match this date range. Try widening it.')+'</div>';
      $('rep').innerHTML=html;
      return;
    }

    html+='<div class="tw"><table><thead><tr>'+
      spec.cols.map(function(c){
        return '<th'+(c.r?' class="r"':'')+'>'+esc(c.label)+'</th>'; }).join('')+
      '</tr></thead><tbody>'+
      spec.rows.map(function(r){
        return '<tr>'+spec.cols.map(function(c,i){
          var v=r.cells[i];
          return '<td'+(c.r?' class="r"':'')+(c.mono?' class="mono'+(c.r?' r':'')+'"':'')+
            '>'+(v==null?'—':v)+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</tbody>'+
      (spec.foot
        ? '<tfoot><tr>'+spec.cols.map(function(c,i){
            return '<td'+(c.r?' class="r"':'')+'>'+(spec.foot[i]==null?'':spec.foot[i])+'</td>';
          }).join('')+'</tr></tfoot>'
        : '')+
      '</table></div>';

    $('rep').innerHTML=html;
  }

  /* ══════════ 2. APPOINTMENT SUMMARY ══════════ */
  function repAppts(){
    var list=APPTS.filter(function(a){
      return inRange(a.date) && mineProv(a.provider_id); });

    /* grouped by provider, because that is how it gets read */
    var by={}, order=[];
    list.forEach(function(a){
      var k=String(a.provider_id||'');
      if(!by[k]){ by[k]={n:0,seen:0,noshow:0,cancel:0,booked:0,mins:0}; order.push(k); }
      var g=by[k], st=String(a.status||'Booked').toLowerCase();
      g.n++; g.mins+=(+a.dur||0);
      if(st==='no-show'||st==='noshow') g.noshow++;
      else if(st==='cancelled'||st==='canceled') g.cancel++;
      else if(st==='arrived'||st==='seen'||st==='completed') g.seen++;
      else g.booked++;
    });

    var tot={n:0,seen:0,noshow:0,cancel:0,booked:0,mins:0};
    order.forEach(function(k){ Object.keys(tot).forEach(function(f){ tot[f]+=by[k][f]; }); });

    table({
      title:'Appointment summary',
      note:'Appointments in this range, grouped by clinician.',
      kpis:[
        {label:'Booked', value:String(tot.n)},
        {label:'Attended', value:String(tot.seen), cls:'good'},
        {label:'Did not attend', value:String(tot.noshow), cls:tot.noshow?'due':''},
        {label:'Cancelled', value:String(tot.cancel)},
        {label:'Clinical hours', value:(tot.mins/60).toFixed(1)}
      ],
      cols:[{label:'Clinician'},{label:'Booked',r:true},{label:'Attended',r:true},
            {label:'Did not attend',r:true},{label:'Cancelled',r:true},
            {label:'Still to come',r:true},{label:'Hours',r:true}],
      rows:order.sort(function(a,b){ return by[b].n-by[a].n; }).map(function(k){
        var g=by[k], nm=provName(k)||'Unassigned';
        return { raw:[nm,g.n,g.seen,g.noshow,g.cancel,g.booked,(g.mins/60).toFixed(1)],
          cells:['<b>'+esc(nm)+'</b>', g.n, g.seen,
            g.noshow?'<span class="pill bad">'+g.noshow+'</span>':'0',
            g.cancel, g.booked, (g.mins/60).toFixed(1)] };
      }),
      foot:['Total', tot.n, tot.seen, tot.noshow, tot.cancel, tot.booked, (tot.mins/60).toFixed(1)]
    });
  }

  /* ══════════ 3. ATTENDANCE ══════════ */
  function repAttend(){
    /* Attendance is the outcome of appointments — arrived, did not, cancelled.
       There is no separate attendance record to draw on, and inventing one
       would mean reporting numbers nothing produced. */
    var list=APPTS.filter(function(a){
      var past=String(a.date||'')<=iso(new Date());
      return past && inRange(a.date) && mineProv(a.provider_id);
    });

    var by={}, order=[];
    list.forEach(function(a){
      var k=String(a.patient_ref||'');
      if(!by[k]){ by[k]={n:0,seen:0,noshow:0,cancel:0,last:''}; order.push(k); }
      var g=by[k], st=String(a.status||'').toLowerCase();
      g.n++;
      if(st==='no-show'||st==='noshow') g.noshow++;
      else if(st==='cancelled'||st==='canceled') g.cancel++;
      else g.seen++;
      if(String(a.date)>g.last) g.last=a.date;
    });

    var tot={n:0,seen:0,noshow:0,cancel:0};
    order.forEach(function(k){ ['n','seen','noshow','cancel'].forEach(function(f){
      tot[f]+=by[k][f]; }); });
    var rate=tot.n?Math.round(tot.seen/tot.n*100):0;

    table({
      title:'Attendance',
      note:'Past appointments only — a visit that has not happened cannot be attended or missed.',
      kpis:[
        {label:'Appointments past', value:String(tot.n)},
        {label:'Attended', value:String(tot.seen), cls:'good'},
        {label:'Missed', value:String(tot.noshow), cls:tot.noshow?'due':''},
        {label:'Attendance rate', value:rate+'%', cls:rate>=85?'good':rate<70?'due':''}
      ],
      cols:[{label:'Patient'},{label:'Appointments',r:true},{label:'Attended',r:true},
            {label:'Missed',r:true},{label:'Cancelled',r:true},{label:'Rate',r:true},
            {label:'Last seen'}],
      rows:order.map(function(k){
        var g=by[k], r=g.n?Math.round(g.seen/g.n*100):0;
        return { g:g, r:r, k:k };
      }).sort(function(a,b){ return a.r-b.r || b.g.n-a.g.n; })
        .map(function(x){
          var g=x.g, r=x.r;
          return { raw:[patName(x.k),g.n,g.seen,g.noshow,g.cancel,r+'%',g.last],
            cells:['<b>'+esc(patName(x.k))+'</b>', g.n, g.seen,
              g.noshow?'<span class="pill bad">'+g.noshow+'</span>':'0',
              g.cancel,
              '<span class="pill '+(r>=85?'ok':r<70?'bad':'warn')+'">'+r+'%</span>',
              esc(fmtD(g.last))] };
        }),
      foot:['Total', tot.n, tot.seen, tot.noshow, tot.cancel, rate+'%', '']
    });
  }

  /* ── the billing arithmetic, in one place ──
     The same sum the chart and the payments screen use, so a report can never
     disagree with the screen a biller checks it against. */
  function encBal(e){
    var fee=(e.lines||[]).reduce(function(a,l){
      return a+(+l.charge||0)*(+l.units||1); },0);
    var b=e.billing||{};
    var pt=patOf(e.patient_ref);
    var ins=((pt&&pt.insurances)||[]).filter(function(x){return x.rank==='1';})[0];
    var resp=b.resp||(ins?'ins':'self');
    var patResp=b.pat_resp!=null?+b.pat_resp:(resp==='self'?fee:(ins?(+ins.copay||0):0));
    var wo=+b.writeoff||0, patPaid=+b.pat_paid||0, insPaid=+b.ins_paid||0;
    var insResp=Math.max(0,fee-patResp-wo);
    return {
      fee:fee, patResp:patResp, patPaid:patPaid, insResp:insResp, insPaid:insPaid, wo:wo,
      patBal:Math.max(0,patResp-patPaid), insBal:Math.max(0,insResp-insPaid),
      signed:Math.round((fee-patPaid-insPaid-wo)*100)/100
    };
  }

  /* ══════════ 4. OUTSTANDING CLAIMS ══════════ */
  function repOutClaims(){
    var OPEN=['submitted','pending','accepted','received','in-process','rejected','denied'];
    var list=CLAIMS.filter(function(c){
      var st=String(c.status||'draft').toLowerCase();
      if(OPEN.indexOf(st)<0) return false;
      if(!inRange(c.submitted_at||c.dos)) return false;
      return mineProv(c.provider_id);
    });

    var tot=0, buckets={'0-30':0,'31-60':0,'61-90':0,'90+':0};
    var rows=list.map(function(c){
      var e=ENCS.filter(function(x){return String(x.id)===String(c.enc_id);})[0];
      var bal=e?encBal(e):{insBal:+c.total||0};
      var owed=bal.insBal>0?bal.insBal:(+c.total||0);
      var age=days(String(c.submitted_at||c.dos).slice(0,10));
      tot+=owed;
      buckets[age<=30?'0-30':age<=60?'31-60':age<=90?'61-90':'90+']+=owed;
      return {c:c, owed:owed, age:age};
    }).sort(function(a,b){ return b.age-a.age; });

    var st=function(s){
      s=String(s||'').toLowerCase();
      return ['rejected','denied'].indexOf(s)>-1?'bad':s==='pending'?'warn':'info';
    };

    table({
      title:'Outstanding claims',
      note:'Claims with the payer that have not been paid. Age counts from the day it was submitted.',
      kpis:[
        {label:'Open claims', value:String(rows.length)},
        {label:'With payers', value:money(tot), cls:'due'},
        {label:'Over 60 days', value:money(buckets['61-90']+buckets['90+']),
         cls:(buckets['61-90']+buckets['90+'])>0?'due':''},
        {label:'Over 90 days', value:money(buckets['90+']),
         cls:buckets['90+']>0?'due':''}
      ],
      cols:[{label:'Claim',mono:true},{label:'Patient'},{label:'Date of service',mono:true},
            {label:'Payer'},{label:'Submitted',mono:true},{label:'Age',r:true},
            {label:'Status'},{label:'Owed',r:true}],
      rows:rows.map(function(x){
        var c=x.c;
        return { raw:[c.claim_no,patName(c.patient_ref),c.dos,c.payer,
                      c.submitted_at,x.age,c.status,x.owed],
          cells:[
            esc(c.claim_no||'—'),
            '<b>'+esc(patName(c.patient_ref))+'</b>',
            esc(fmtD(c.dos)),
            esc(c.payer||'—'),
            esc(c.submitted_at?fmtD(c.submitted_at):'—'),
            '<span class="age '+ageCls(x.age)+'">'+x.age+'d</span>',
            '<span class="pill '+st(c.status)+'">'+esc(String(c.status||'').toUpperCase())+'</span>',
            '<b>'+money(x.owed)+'</b>'
          ]};
      }),
      foot:['','','','','','','Total', money(tot)],
      emptyNote:'No claims are waiting on a payer in this range.'
    });
  }

  /* ══════════ 5. OUTSTANDING PATIENT BALANCES ══════════ */
  function repOutPat(){
    var by={}, order=[];
    ENCS.forEach(function(e){
      if(String(e.status||'')!=='locked') return;
      if(!inRange(e.dos)) return;
      if(!mineProv(e.clinician_id)) return;
      var b=encBal(e);
      if(b.patBal<=0.004) return;
      var k=String(e.patient_ref);
      if(!by[k]){ by[k]={bal:0,visits:0,oldest:e.dos,newest:e.dos}; order.push(k); }
      var g=by[k];
      g.bal+=b.patBal; g.visits++;
      if(String(e.dos)<g.oldest) g.oldest=e.dos;
      if(String(e.dos)>g.newest) g.newest=e.dos;
    });

    var tot=0, over60=0, over90=0;
    var rows=order.map(function(k){
      var g=by[k], age=days(g.oldest);
      tot+=g.bal;
      if(age>=60) over60+=g.bal;
      if(age>=90) over90+=g.bal;
      return {k:k, g:g, age:age};
    }).sort(function(a,b){ return b.g.bal-a.g.bal; });

    table({
      title:'Outstanding patient balances',
      note:'What patients still owe after the payer has settled. Age counts from their oldest unpaid visit.',
      kpis:[
        {label:'Patients owing', value:String(rows.length)},
        {label:'Total owed', value:money(tot), cls:'due'},
        {label:'Over 60 days', value:money(over60), cls:over60>0?'due':''},
        {label:'Over 90 days', value:money(over90), cls:over90>0?'due':''}
      ],
      cols:[{label:'Patient'},{label:'Patient ID',mono:true},{label:'Contact'},
            {label:'Visits',r:true},{label:'Oldest unpaid',mono:true},
            {label:'Age',r:true},{label:'Owed',r:true}],
      rows:rows.map(function(x){
        var p=patOf(x.k);
        return { raw:[patName(x.k), p?p.internal_id:'', p?(p.mobile||p.phone||''):'',
                      x.g.visits, x.g.oldest, x.age, x.g.bal],
          cells:[
            '<b>'+esc(patName(x.k))+'</b>',
            esc(p?p.internal_id||'—':'—'),
            esc(p?(p.mobile||p.phone||'—'):'—'),
            x.g.visits,
            esc(fmtD(x.g.oldest)),
            '<span class="age '+ageCls(x.age)+'">'+x.age+'d</span>',
            '<b>'+money(x.g.bal)+'</b>'
          ]};
      }),
      foot:['Total','','','','','', money(tot)],
      emptyNote:'No patient owes anything in this range.'
    });
  }

  /* ══════════ 6. FILED CLAIMS ══════════ */
  function repFiled(){
    var FILED=['submitted','pending','accepted','received','in-process','paid','denied','rejected'];
    var list=CLAIMS.filter(function(c){
      if(FILED.indexOf(String(c.status||'draft').toLowerCase())<0) return false;
      if(!inRange(c.submitted_at||c.dos)) return false;
      return mineProv(c.provider_id);
    }).sort(function(a,b){
      return String(b.submitted_at||b.dos||'').localeCompare(String(a.submitted_at||a.dos||''));
    });

    var billed=0, paid=0, denied=0, deniedAmt=0;
    list.forEach(function(c){
      billed+=(+c.total||0);
      var e=ENCS.filter(function(x){return String(x.id)===String(c.enc_id);})[0];
      if(e) paid+=encBal(e).insPaid;
      if(['denied','rejected'].indexOf(String(c.status||'').toLowerCase())>-1){
        denied++; deniedAmt+=(+c.total||0);
      }
    });
    var rate=list.length?Math.round((list.length-denied)/list.length*100):0;

    table({
      title:'Filed claims',
      note:'Everything sent to a payer in this range, and what has come back.',
      kpis:[
        {label:'Claims filed', value:String(list.length)},
        {label:'Billed', value:money(billed)},
        {label:'Paid by payers', value:money(paid), cls:'good'},
        {label:'Denied or rejected', value:String(denied), cls:denied?'due':''},
        {label:'Acceptance rate', value:rate+'%', cls:rate>=90?'good':rate<75?'due':''}
      ],
      cols:[{label:'Claim',mono:true},{label:'Patient'},{label:'Date of service',mono:true},
            {label:'Submitted',mono:true},{label:'Payer'},{label:'Payer reference',mono:true},
            {label:'Status'},{label:'Billed',r:true},{label:'Paid',r:true}],
      rows:list.map(function(c){
        var e=ENCS.filter(function(x){return String(x.id)===String(c.enc_id);})[0];
        var ip=e?encBal(e).insPaid:0;
        var s=String(c.status||'').toLowerCase();
        var cls=s==='paid'?'ok':['denied','rejected'].indexOf(s)>-1?'bad':'info';
        return { raw:[c.claim_no,patName(c.patient_ref),c.dos,c.submitted_at,c.payer,
                      c.stedi_claim_no||'',c.status,+c.total||0,ip],
          cells:[
            esc(c.claim_no||'—'),
            '<b>'+esc(patName(c.patient_ref))+'</b>',
            esc(fmtD(c.dos)),
            esc(c.submitted_at?fmtD(c.submitted_at):'—'),
            esc(c.payer||'—'),
            esc(c.stedi_claim_no||c.correlationId||'—'),
            '<span class="pill '+cls+'">'+esc(String(c.status||'').toUpperCase())+'</span>',
            money(c.total),
            ip>0?'<b>'+money(ip)+'</b>':'—'
          ]};
      }),
      foot:['','','','','','','Total', money(billed), money(paid)],
      emptyNote:'No claims were filed in this range.'
    });
  }

  /* ══════════ 7. PAYMENT SUMMARY ══════════ */
  function repPays(){
    var list=PAYS.filter(function(p){
      var d=String(p.paid_on||p.at||'').slice(0,10);
      if(!inRange(d)) return false;
      if(!PROV) return true;
      var e=ENCS.filter(function(x){return String(x.id)===String(p.enc_id);})[0];
      return e ? mineProv(e.clinician_id) : true;
    }).sort(function(a,b){
      return String(b.paid_on||b.at||'').localeCompare(String(a.paid_on||a.at||''));
    });

    var fromPat=0, fromIns=0, credits=0, wo=0;
    list.forEach(function(p){
      var amt=+p.amount||0;
      wo+=(+p.writeoff||0);
      if(p.credit) credits+=amt;
      else if(p.kind==='era') fromIns+=amt;
      else fromPat+=amt;
    });

    /* how it arrived, since reconciling a bank statement needs the split */
    var byMethod={};
    list.forEach(function(p){
      if(p.credit) return;
      var m=p.method||'Unrecorded';
      byMethod[m]=(byMethod[m]||0)+(+p.amount||0);
    });
    var methods=Object.keys(byMethod).sort(function(a,b){ return byMethod[b]-byMethod[a]; });

    table({
      title:'Payment summary',
      note:'Money received in this range. Credits are shown separately — they arrived, but they are not yet earned.'+
        (methods.length?'  By method: '+methods.map(function(m){
          return m+' '+money(byMethod[m]); }).join(' · '):''),
      kpis:[
        {label:'Payments', value:String(list.length)},
        {label:'From patients', value:money(fromPat), cls:'good'},
        {label:'From payers', value:money(fromIns), cls:'good'},
        {label:'Total received', value:money(fromPat+fromIns), cls:'good'},
        {label:'Held in credit', value:money(credits)},
        {label:'Written off', value:money(wo)}
      ],
      cols:[{label:'Date',mono:true},{label:'Patient'},{label:'From'},{label:'Method'},
            {label:'Reference',mono:true},{label:'Date of service',mono:true},
            {label:'Taken by'},{label:'Amount',r:true}],
      rows:list.map(function(p){
        var era=p.kind==='era';
        return { raw:[String(p.paid_on||p.at||'').slice(0,10), patName(p.patient_ref),
                      era?(p.payer||'Insurer'):'Patient', p.method||'', p.reference||'',
                      p.dos||'', p.taken_by||'', +p.amount||0],
          cells:[
            esc(fmtD(String(p.paid_on||p.at||'').slice(0,10))),
            '<b>'+esc(patName(p.patient_ref))+'</b>',
            era ? '<span class="pill info">'+esc(String(p.payer||'INSURER').toUpperCase())+'</span>'
                : '<span class="pill ok">PATIENT</span>',
            esc(p.method||'—'),
            esc(p.reference||'—'),
            esc(p.dos?fmtD(p.dos):'—'),
            esc(p.taken_by||'—'),
            (p.credit?'<span style="color:#6D4AC0">':'<b>')+money(p.amount)+
              (p.credit?' credit</span>':'</b>')
          ]};
      }),
      foot:['','','','','','','Total', money(fromPat+fromIns+credits)],
      emptyNote:'No payments were recorded in this range.'
    });
  }

  /* ══════════ 8. ELIGIBILITY SUMMARY ══════════ */
  function repElig(){
    /* Eligibility checks are written to the patient's history, which is the
       durable record. The 24-hour cache on the eligibility screen is not. */
    var list=HIST.filter(function(h){
      if(String(h.what||'')!=='eligibility_checked') return false;
      return inRange(String(h.at||'').slice(0,10));
    }).sort(function(a,b){ return String(b.at||'').localeCompare(String(a.at||'')); });

    var active=0, inactive=0, failed=0;
    list.forEach(function(h){
      var d=String(h.detail||'').toLowerCase();
      if(/not (active|covered)|inactive|no coverage|terminated/.test(d)) inactive++;
      else if(/error|could not|failed|unable/.test(d)) failed++;
      else active++;
    });

    /* who has never been checked at all */
    var checked={};
    list.forEach(function(h){ checked[String(h.patient_ref)]=true; });
    var unchecked=PATS.filter(function(p){
      return String(p.status||'active')!=='inactive' &&
             (p.insurances||[]).length && !checked[String(p.id)];
    });

    table({
      title:'Eligibility summary',
      note:'Cover checks run in this range, from the patient record. '+
           (unchecked.length
             ? unchecked.length+' insured patient'+(unchecked.length===1?'':'s')+
               ' have not been checked at all.'
             : 'Every insured patient has been checked at least once.'),
      kpis:[
        {label:'Checks run', value:String(list.length)},
        {label:'Cover active', value:String(active), cls:'good'},
        {label:'Not covered', value:String(inactive), cls:inactive?'due':''},
        {label:'Could not check', value:String(failed), cls:failed?'due':''},
        {label:'Never checked', value:String(unchecked.length),
         cls:unchecked.length?'due':''}
      ],
      cols:[{label:'Checked',mono:true},{label:'Patient'},{label:'Result'},{label:'By'}],
      rows:list.map(function(h){
        var d=String(h.detail||'');
        var bad=/not (active|covered)|inactive|no coverage|terminated/i.test(d);
        var err=/error|could not|failed|unable/i.test(d);
        return { raw:[String(h.at||'').slice(0,10), patName(h.patient_ref), d, h.by||''],
          cells:[
            esc(fmtD(String(h.at||'').slice(0,10)))+
              '<small>'+esc(new Date(h.at).toLocaleTimeString(undefined,
                {hour:'numeric',minute:'2-digit'}))+'</small>',
            '<b>'+esc(patName(h.patient_ref))+'</b>',
            '<span class="pill '+(err?'warn':bad?'bad':'ok')+'">'+
              (err?'NO ANSWER':bad?'NOT COVERED':'ACTIVE')+'</span>'+
              (d?'<small>'+esc(d)+'</small>':''),
            esc(h.by||'—')
          ]};
      }),
      emptyNote:'No eligibility checks were run in this range.'
    });
  }

  /* ── run whichever is chosen ── */
  var RUN={ clients:repClients, appts:repAppts, attend:repAttend,
            outclaims:repOutClaims, outpat:repOutPat, filed:repFiled,
            pays:repPays, elig:repElig };

  function run(){
    $('rep').innerHTML='<div class="spin"><i></i></div>';
    setTimeout(function(){
      try{ (RUN[CUR]||repClients)(); }
      catch(err){
        console.error('report failed', err);
        $('rep').innerHTML='<div class="empty"><b>That report could not be built</b>'+
          esc(err.message)+'</div>';
      }
    }, 30);
  }

  /* ── export ── */
  $('csv').addEventListener('click',function(){
    if(!LAST.rows.length){ alert('Nothing to export.'); return; }
    var q=function(v){
      v=String(v==null?'':v);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    };
    var lines=[];
    lines.push(q(LAST.title+' · '+(FROM||'all time')+' to '+(TO||'today')));
    if(PROV) lines.push(q('Clinician: '+provName(PROV)));
    lines.push('');
    lines.push(LAST.cols.map(function(c){ return q(c.label); }).join(','));
    LAST.rows.forEach(function(r){
      lines.push((r.raw||[]).map(q).join(','));
    });
    if(LAST.foot) lines.push(LAST.foot.map(q).join(','));

    var name=LAST.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+
      (FROM||'all')+'.csv';
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
    a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  $('print').addEventListener('click',function(){ window.print(); });

  /* ── open ── */
  (async function(){
    await RFStore.ready();
    SESS=RFStore.getSession();
    if(!SESS){ window.location.href='../reviflow.html'; return; }
    /* the shared header fills #rfWho from _session.js, so nothing to do here */

    try{ PROVS=await RFStore.providers(); }catch(e){ PROVS=[]; }
    $('prov').innerHTML='<option value="">Everyone</option>'+
      PROVS.filter(function(p){ return String(p.status||'active')!=='inactive'; })
        .map(function(p){
          return '<option value="'+p.id+'">'+esc(p.full_name)+'</option>'; }).join('');

    /* a clinician sees their own work by default */
    if(SESS.provider_ref!=null && SESS.role==='provider'){
      PROV=String(SESS.provider_ref);
      $('prov').value=PROV;
    }

    try{ PATS=await RFStore.patients(); }catch(e){ PATS=[]; }
    try{ CLAIMS=await RFStore.claims({}); }catch(e){ CLAIMS=[]; }
    try{ PAYS=await RFStore.payments({}); }catch(e){ PAYS=[]; }
    try{ HIST=await RFStore.history(); }catch(e){ HIST=[]; }

    /* appointments and encounters are held per patient */
    APPTS=[]; ENCS=[];
    for(var i=0;i<PATS.length;i++){
      try{
        var a=await RFStore.apptsForPatient(PATS[i].id);
        (a||[]).forEach(function(x){ x.patient_ref=PATS[i].id; APPTS.push(x); });
      }catch(e){}
      try{
        var en=await RFStore.encounters(PATS[i].id);
        (en||[]).forEach(function(x){ x.patient_ref=PATS[i].id; ENCS.push(x); });
      }catch(e){}
    }

    var now=new Date();
    FROM=iso(new Date(now.getTime()-30*86400000)); TO=iso(now);
    $('from').value=FROM; $('to').value=TO;

    paintPicks();
    run();
  })();

})();
</script>
</body>
</html>
